<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>College Timetable</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="authView" class="auth-shell">
    <div class="auth-card">
      <div class="brand-mark">CT</div>
      <h1>College Timetable</h1>
      <p class="muted">Sign in to view your timetable and college updates.</p>
      <div class="tabs"><button class="tab active" data-auth="login">Login</button><button type="button" class="tab" data-auth="signup" onclick="setAuthMode('signup')">Create account</button></div>
      <form id="authForm">
        <label>Email<input id="email" type="email" required autocomplete="email" /></label>
        <label>Password<input id="password" type="password" required minlength="6" autocomplete="current-password" /></label>
        <div id="signupFields" class="hidden">
          <label>Full name<input id="fullName" type="text" /></label>
          <label>Role<select id="role"><option value="student">Student</option><option value="professor">Professor</option></select></label>
        </div>
        <button class="primary wide" type="submit" id="authSubmit">Login</button>
      </form>
      <p id="authMessage" class="message"></p>
      <p class="tiny">First-time setup: run <b>supabase-schema.sql</b> in Supabase SQL Editor, then add your Project URL and Publishable key in <b>app.js</b>.</p>
    </div>
  </div>

  <div id="appView" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand"><span>CT</span><div><strong>College Timetable</strong><small id="sideRole">Portal</small></div></div>
      <nav>
        <button data-section="dashboard" class="nav-item active">Dashboard</button>
        <button data-section="timetable" class="nav-item">Timetable</button>
        <button data-section="classes" class="nav-item">Classes</button>
        <button data-section="classrooms" class="nav-item">Classrooms</button>
        <button data-section="subjects" class="nav-item">Subjects</button>
        <button data-section="notifications" class="nav-item">Notifications</button>
        <button data-section="absences" class="nav-item professor-only">My Absences</button>
        <button data-section="admin" class="nav-item admin-only">Admin</button>
      </nav>
      <button id="logoutBtn" class="logout">Sign out</button>
    </aside>
    <main class="main">
      <header class="topbar"><div><span class="eyebrow">College Portal</span><h2 id="pageTitle">Dashboard</h2></div><div class="user-chip"><span id="userInitial">U</span><div><b id="userName">User</b><small id="userEmail"></small></div></div></header>
      <div id="content" class="content"></div>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
